<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">CareerPathDesk public repository architecture</title>
  <desc id="desc">The static website stays separate from the Vue frontend, Go API, PostgreSQL database, and restricted student invitation path.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e63d3"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e8a65"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#10233f"/>
  <text x="56" y="64" fill="#8fd8b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">THREE REPOSITORIES · ONE EXPLICIT CONTRACT</text>
  <text x="56" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="38" font-weight="750">官网解释产品，前后端承载服务</text>

  <g id="website" transform="translate(56 172)">
    <rect width="240" height="154" rx="20" fill="#ffffff"/>
    <text x="24" y="42" fill="#2e63d3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">PUBLIC STORY</text>
    <text x="24" y="82" fill="#10233f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="750">官网</text>
    <text x="24" y="116" fill="#61738b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">介绍 · 演示 · 源码入口</text>
  </g>

  <g id="frontend" transform="translate(356 172)">
    <rect width="240" height="154" rx="20" fill="#e7eefc"/>
    <text x="24" y="42" fill="#2e63d3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">VUE 3 · TYPESCRIPT</text>
    <text x="24" y="82" fill="#10233f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="750">产品前端</text>
    <text x="24" y="116" fill="#61738b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">角色工作台 · 同源请求</text>
  </g>

  <g id="backend" transform="translate(656 172)">
    <rect width="240" height="154" rx="20" fill="#dff1e9"/>
    <text x="24" y="42" fill="#1e8a65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">GO · GIN · PGX</text>
    <text x="24" y="82" fill="#10233f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="750">业务 API</text>
    <text x="24" y="116" fill="#61738b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">权限 · 事务 · 审计边界</text>
  </g>

  <g id="database" transform="translate(956 172)">
    <rect width="188" height="154" rx="20" fill="#ffffff"/>
    <text x="24" y="42" fill="#1e8a65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">POSTGRESQL 18</text>
    <text x="24" y="82" fill="#10233f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="750">数据</text>
    <text x="24" y="116" fill="#61738b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">迁移 · 合成种子</text>
  </g>

  <path d="M 296 249 L 340 249" stroke="#2e63d3" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 596 249 L 640 249" stroke="#2e63d3" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 896 249 L 940 249" stroke="#1e8a65" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="student-path" transform="translate(356 372)">
    <circle cx="18" cy="18" r="18" fill="#8fd8b8"/>
    <text x="48" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">学生邀请走独立的受限会话</text>
    <text x="48" y="42" fill="#bcc8d7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">一次性链接 → 短时 Cookie → 仅限自己的资料与问卷</text>
    <path d="M 0 72 L 540 72" stroke="#1e8a65" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-green)"/>
  </g>

  <text x="56" y="462" fill="#7f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SYNTHETIC DATA ONLY · NO SHARED SECRETS · SAME-ORIGIN /api</text>
</svg>
