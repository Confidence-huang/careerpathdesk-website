<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CareerPathDesk 项目官网</title>
  <desc id="desc">一条蓝绿色连接线串联老板、老师和学生三个角色，表达同一工作台里的职业服务闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#0b3b45"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#5de0bd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="-20" r="210" fill="#1f7a73" opacity=".13"/>
  <circle cx="110" cy="365" r="180" fill="#287bd1" opacity=".12"/>
  <text x="72" y="88" fill="#8cc8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">CAREER SERVICE BLUEPRINT</text>
  <text x="72" y="153" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="760">CareerPathDesk</text>
  <text x="72" y="198" fill="#c5d8e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">一个工作台，连接老板、老师和学生</text>
  <path d="M510 250 H1065" stroke="url(#lane)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(565 250)"><circle r="48" fill="#102f4b" stroke="#67b3ff" stroke-width="3"/><text y="10" fill="#fff" font-size="27" font-weight="700">老板</text></g>
    <g transform="translate(790 250)"><circle r="48" fill="#103b43" stroke="#65dec0" stroke-width="3"/><text y="10" fill="#fff" font-size="27" font-weight="700">老师</text></g>
    <g transform="translate(1015 250)"><circle r="48" fill="#173c50" stroke="#8bd8df" stroke-width="3"/><text y="10" fill="#fff" font-size="27" font-weight="700">学生</text></g>
  </g>
  <text x="72" y="302" fill="#8faabd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">官网 · Vue 前端 · Go 后端 · PostgreSQL</text>
</svg>
